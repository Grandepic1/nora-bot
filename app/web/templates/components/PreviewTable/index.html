<div class="overflow-x-auto rounded-xl border border-line bg-white shadow-sm">
	<table class="w-full border-separate border-spacing-0 text-left">
		<thead>
			{% include "components/PreviewTable/TableHeader.html" %}
		</thead>
		<tbody>
			{% for row in rows %}
				{% include "components/PreviewTable/TableRow.html" %}
			{% endfor %}
		</tbody>
	</table>
</div>
{% if editable %}
<script>
	for (const field of document.querySelectorAll(".preview-cell-input")) {
		const fitContent = () => {
			field.style.height = "auto";
			field.style.height = `${field.scrollHeight}px`;
		};
		fitContent();
		field.addEventListener("input", fitContent);
	}
</script>
{% endif %}
