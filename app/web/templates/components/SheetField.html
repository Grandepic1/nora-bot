<div class="flex flex-col gap-4 rounded-xl border border-line bg-white p-5 shadow-sm">
	{% if fixed_sheet_name %}
		<div class="flex flex-col gap-0.5">
			<span class="text-xs text-secondary">Sheet saat ini</span>
			<strong class="text-sm font-medium text-ink">{{ fixed_sheet_name }}</strong>
		</div>
	{% endif %}

	<label class="flex flex-col gap-2 text-xs text-secondary" for="{{ field.name }}">
		Nama sheet baru
		<input id="{{ field.name }}" name="{{ field.name }}" value="{{ field.value }}" class="w-full rounded-lg border border-line bg-white px-3 py-2.5 text-sm text-ink outline-none transition focus:border-accent focus:ring-3 focus:ring-accent/10">
	</label>
</div>
