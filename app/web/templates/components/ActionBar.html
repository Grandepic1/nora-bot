{% if pending %}
	<div class="flex justify-center">
		<button type="submit" class="inline-flex items-center justify-center gap-2 rounded-xl bg-accent px-7 py-3 text-sm font-semibold text-white shadow-sm transition hover:brightness-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
			Tempel ke Sheets
		</button>
	</div>
{% else %}
	<div class="flex flex-col items-center gap-3">
		<div class="flex items-center gap-3 rounded-xl border px-5 py-3.5 {{ 'border-success/25 bg-success/5' if successful else 'border-accent/25 bg-accent/5' }}">
			<span class="flex size-6 shrink-0 items-center justify-center rounded-full text-sm font-bold text-white {{ 'bg-success' if successful else 'bg-accent' }}">
				{% if successful %}
					<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="size-3.5" aria-hidden="true">
						<path d="M3 8.5 6.5 12 13 4.5"></path>
					</svg>
				{% else %}
					!
				{% endif %}
			</span>
			<div class="flex flex-col">
				<span class="text-sm font-semibold text-ink">{{ state.heading }}</span>
				<span class="text-xs text-secondary">{{ state.detail }}</span>
			</div>
		</div>
	</div>
{% endif %}
